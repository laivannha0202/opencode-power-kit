name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for merge-base diff checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install opencode (required by resolved-config tests)
        run: npm install -g opencode-ai

      - name: Run release gate
        run: bash scripts/release-gate.sh
